# Rust へ移すもの一式の置き場（cargo のワークスペース）。
#
# discord.py をやめて serenity へ移すと決めた（2026-11-25）。移行が終わるまでは
# Python と Rust が本番で共存するので、Python 側の配置（リポジトリ直下）は崩さず、
# Rust はこの下にまとめる。プロセス同士は Python の import やファイルではなく、
# Postgres と Valkey でつなぐ（services/dev_signals.py の冒頭と同じ考え方）。
#
# 版の固定は Python と同じ方針にする。
#   Rust 本体  rust-toolchain.toml で 1.100.0 に固定
#   依存       Cargo.toml では = で書き、Cargo.lock をコミットする
# 「手元・CI・本番で同じものが動く」ことしか保証しないので、上げるときは
# 版を書き換えるコミットとして明示的に行う。

[workspace]
resolver = "3"
members = ["apps/bot", "crates/sycs-core", "crates/sycs-imaging", "crates/sycs-text", "tools/voice-check"]

# 依存の版はここで 1 回だけ決める（各 crate は `{ workspace = true }` で受け取る）。
#
# crate ごとに版を書いていると、Bot と道具と土台で serenity や sqlx の版が食い違い、
# 1 つだけ上げ忘れる。版は = で固定する（冒頭の方針）。features は各 crate が足す。
[workspace.dependencies]
chrono = { version = "=0.4.45", default-features = false }
flate2 = { version = "=1.1.11" }
# 地震の通知を全部の送り先へ並べて送るのと、WebSocket の読み書き（既にロックにある版）。
futures-util = { version = "=0.3.34", default-features = false }
# 地震の画像の文字を Pillow と同じに並べる（HarfBuzz の Rust への写し。raqm＝HarfBuzz と同じ並びを出す）。
harfrust = { version = "=0.16.2", default-features = false }
# DJAudio の配信の印（Python の uuid4 と同じく OS の乱数）。ロックに既にある版。
getrandom = { version = "=0.3.4" }
# ハッシュの 16 進表記（既にロックにある版）。
hex = { version = "=0.4.3" }
# URL の安全確認で、ASCII 以外のホスト名を reqwest と同じ変換（UTS46）にする。
idna = { version = "=1.1.0" }
# アバターの代表色（ログの Embed の色）のために png と gif を読む。
image = { version = "=0.25.10", default-features = false }
# 期限つきキャッシュの「最後に使われた順」。serde_json（preserve_order）が既に使っている版。
indexmap = { version = "=2.14.2" }
# ニュースの「送った記事」の印（リンクの md5。Python の hashlib.md5 と同じ値にする）。sqlx が既に使っている版。
md-5 = { version = "=0.11.0", default-features = false }
percent-encoding = { version = "=2.3.2" }
# 地震の地図のタイル（PNG）を、ファイルに入っている色の形のまま読む（明るさへの直し方を Pillow に
# 合わせるため）。image が既に使っている版。
png = { version = "=0.18.1" }
redis = { version = "=1.8.3", default-features = false }
# リアクションロールの絵文字の照合で、Python と同じ正規表現をそのまま使う（ログのフィルタが既に使っている版）。
regex = { version = "=1.13.2" }
# serenity が使っているのと同じ版・同じ TLS（rustls）にして、二重に入らないようにする。
reqwest = { version = "=0.12.28", default-features = false }
# ニュースの RSS を読む（読むだけの小さな XML の木。依存は既にロックにある memchr だけ）。
roxmltree = { version = "=0.21.2" }
serde_json = { version = "=1.0.154" }
# VirusTotal の URL の鍵とファイルのハッシュ（sqlx が既に使っている版）。
sha2 = { version = "=0.10.9" }
serenity = { version = "=0.12.5", default-features = false }
# 地震の画像の文字の輪郭とヒンティング（FreeType と同じ点を出す、Google の Fontations）。
skrifa = { version = "=0.50.0", default-features = false }
songbird = { version = "=0.6.1" }
sqlx = { version = "=0.9.1", default-features = false }
symphonia = { version = "=0.5.5" }
sycs-core = { path = "crates/sycs-core" }
# Pillow と画素まで同じ結果を出す画像処理（地震の地図の図形・ぼかし・重ね合わせ・拡大縮小）。
sycs-imaging = { path = "crates/sycs-imaging" }
sycs-text = { path = "crates/sycs-text" }
tempfile = { version = "=3.27.0" }
tokio = { version = "=1.54.1" }
# 地震の電文の受け取り（P2P地震情報の WebSocket）。songbird が既に使っている版・同じ TLS（rustls）。
tokio-tungstenite = { version = "=0.26.2", default-features = false }
tracing = { version = "=0.1.44" }
tracing-subscriber = { version = "=0.3.23", default-features = false }
# URL の安全確認の NFKC（Python の urlsplit の検査と同じ）。url crate が既に使っている版。
unicode-normalization = { version = "=0.1.26" }
# 文字の種類（重ねる記号か）で、raqm と同じに用字を決める（idna が既に使っている版）。
unicode-properties = { version = "=0.1.5", default-features = false }

[workspace.package]
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

# 全員に効く lint。個々の crate は `[lints] workspace = true` で受け取る。
[workspace.lints.rust]
# unsafe は書かない。必要になったら、その crate だけで理由を書いて許す。
unsafe_code = "forbid"
# Python 側で docstring を 100% にしているのと同じ。公開するものには説明を書く。
missing_docs = "warn"

[workspace.lints.clippy]
# CI では -D warnings で回すので、warn がそのまま落ちる条件になる。
all = { level = "warn", priority = -1 }

# 地震の画像の文字（crates/sycs-text）は、画素を 1 つずつ回す。最適化なし（cargo test・cargo build の既定）だと
# 桁違いに遅く、CI のテスト（QEMU の Sandy Bridge のふり）が終わらない。この crate と、字の形を出す依存だけ
# 最適化を効かせる（Bot 本体と他の依存のビルドは変わらない。release は元から最適化される）。
[profile.dev.package.sycs-text]
opt-level = 3

[profile.dev.package.skrifa]
opt-level = 3

[profile.dev.package.read-fonts]
opt-level = 3

[profile.dev.package.font-types]
opt-level = 3

[profile.dev.package.harfrust]
opt-level = 3

# 基準と比べるハッシュ（文字のテストは 1 回に数百 MB の画素を通す。最適化なしだと QEMU の上で分単位になる）。
[profile.dev.package.sha2]
opt-level = 3

# 地震の地図の図形・ぼかし・重ね合わせ・拡大縮小（crates/sycs-imaging）も、画素を 1 つずつ回す。最適化なしだと
# 地図 1 枚（2400×1440 で描いて縮める）に 5 秒かかり、CI（QEMU の Sandy Bridge のふり）ではその数倍になる
# （地図 12 枚の突き合わせが 7 分）。この crate だけ最適化すれば 1 枚 0.3 秒で済む。
[profile.dev.package.sycs-imaging]
opt-level = 3
