# Rust へ移すもの一式の置き場（cargo のワークスペース）。
#
# discord.py をやめて serenity へ移すと決めた（2026-11-25）。移行が終わるまでは
# Python と Rust が本番で共存するので、Python 側の配置（リポジトリ直下）は崩さず、
# Rust はこの下にまとめる。プロセス同士は Python の import やファイルではなく、
# Postgres と Valkey でつなぐ（services/dev_signals.py の冒頭と同じ考え方）。
#
# 版の固定は Python と同じ方針にする。
#   Rust 本体  rust-toolchain.toml で 1.100.0 に固定
#   依存       Cargo.toml では = で書き、Cargo.lock をコミットする
# 「手元・CI・本番で同じものが動く」ことしか保証しないので、上げるときは
# 版を書き換えるコミットとして明示的に行う。

[workspace]
resolver = "3"
members = ["apps/bot", "crates/sycs-core", "tools/voice-check"]

# 依存の版はここで 1 回だけ決める（各 crate は `{ workspace = true }` で受け取る）。
#
# crate ごとに版を書いていると、Bot と道具と土台で serenity や sqlx の版が食い違い、
# 1 つだけ上げ忘れる。版は = で固定する（冒頭の方針）。features は各 crate が足す。
[workspace.dependencies]
chrono = { version = "=0.4.45", default-features = false }
flate2 = { version = "=1.1.11" }
# アバターの代表色（ログの Embed の色）のために png と gif を読む。
image = { version = "=0.25.10", default-features = false }
percent-encoding = { version = "=2.3.2" }
redis = { version = "=1.8.3", default-features = false }
# serenity が使っているのと同じ版・同じ TLS（rustls）にして、二重に入らないようにする。
reqwest = { version = "=0.12.28", default-features = false }
serde_json = { version = "=1.0.154" }
serenity = { version = "=0.12.5", default-features = false }
songbird = { version = "=0.6.1" }
sqlx = { version = "=0.9.1", default-features = false }
symphonia = { version = "=0.5.5" }
sycs-core = { path = "crates/sycs-core" }
tempfile = { version = "=3.27.0" }
tokio = { version = "=1.54.1" }
tracing = { version = "=0.1.44" }
tracing-subscriber = { version = "=0.3.23", default-features = false }

[workspace.package]
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

# 全員に効く lint。個々の crate は `[lints] workspace = true` で受け取る。
[workspace.lints.rust]
# unsafe は書かない。必要になったら、その crate だけで理由を書いて許す。
unsafe_code = "forbid"
# Python 側で docstring を 100% にしているのと同じ。公開するものには説明を書く。
missing_docs = "warn"

[workspace.lints.clippy]
# CI では -D warnings で回すので、warn がそのまま落ちる条件になる。
all = { level = "warn", priority = -1 }
