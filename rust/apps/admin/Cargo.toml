[package]
name = "sycs-admin"
version = "0.1.0"
description = "管理画面（rust-06）。Python の webapp_admin を置き換える（骨組み: セッションの Cookie・確かめ・エラーの答え・見出し・回数の制限・数とインシデント）"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# 版は rust/Cargo.toml の [workspace.dependencies] で決める。
[dependencies]
axum = { workspace = true, features = ["http1", "tokio"] }
# インシデントの時刻（UTC の ISO 8601）。sycs-core が既に使っている版。
chrono = { workspace = true, features = ["std"] }
# CSRF の印とインシデントの ID（Python の secrets.token_hex・uuid4 と同じく OS の乱数）。
getrandom = { workspace = true }
# セッションの Cookie の署名（itsdangerous の TimestampSigner と同じ HMAC-SHA1）。ロックに既にある版。
hmac = { workspace = true }
# テンプレート（webapp_admin/templates/ を Jinja2 と同じ書き方のまま読む。A2）。
minijinja = { workspace = true, features = ["loader"] }
percent-encoding = { workspace = true }
# /metrics が Valkey の sycs:metrics: の下を読む（SCAN・MGET。A7）。sycs-core の報告口と同じ版・同じ features。
redis = { workspace = true, features = ["tokio-comp", "connection-manager"] }
# 経路の引き方を Starlette の正規表現と同じにする（`$` の扱いだけ書き換える）。
regex = { workspace = true }
# Discord の API（ログインの OAuth と、Bot のトークンで引くサーバーとメンバー。A3）。Bot と同じ版・同じ TLS（rustls）。
reqwest = { workspace = true, features = ["rustls-tls"] }
# セッションの中身を、入れた鍵の順のまま読み書きする（Python の dict と同じ順）。
serde_json = { workspace = true, features = ["preserve_order"] }
sha1 = { workspace = true }
# 利用者の状態（A4）を user_state_audit の Postgres から読む（Bot と sycs-core と同じ版・同じ features）。
sqlx = { workspace = true, features = ["runtime-tokio", "postgres"] }
sycs-core = { workspace = true }
sycs-web = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# 偽物の Valkey（RESP を話す小さな受け口）を読み書きする（A7）。
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
