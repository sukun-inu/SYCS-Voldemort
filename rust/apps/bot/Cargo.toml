[package]
name = "sycs-bot"
version = "0.1.0"
description = "SYCS-Voldemort の Discord Bot（serenity）。discord.py の Bot を置き換える"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# 版は rust/Cargo.toml の [workspace.dependencies] で決める。
[dependencies]
chrono = { workspace = true, features = ["clock", "std"] }
futures-util = { workspace = true, features = ["std", "sink"] }
getrandom = { workspace = true }
hex = { workspace = true }
image = { workspace = true, features = ["png", "gif"] }
md-5 = { workspace = true }
percent-encoding = { workspace = true }
png = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true, features = ["rustls-tls", "multipart"] }
roxmltree = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
serenity = { workspace = true, features = [
    "builder",
    "cache",
    "client",
    "gateway",
    "model",
    "rustls_backend",
    "voice",
] }
# 読み上げの音声（VC への接続と再生）。版は tools/voice-check で DAVE 必須の VC に音が届くことを確かめたもの。
songbird = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio", "postgres"] }
sycs-core = { workspace = true }
sycs-imaging = { workspace = true }
sycs-text = { workspace = true }
# 合成した wav を songbird に読ませる（symphonia の wav / pcm の復号器）。
symphonia = { workspace = true, features = ["wav", "pcm"] }
# DJAudio の一時ディレクトリ（Python の tempfile.TemporaryDirectory）。
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "time", "process", "sync"] }
tokio-tungstenite = { workspace = true, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
tracing = { workspace = true }

[dev-dependencies]
# VirusTotal の結合テストで、偽物の HTTP サーバーをテストの中に立てる。
tokio = { workspace = true, features = ["net", "io-util", "macros", "rt-multi-thread"] }
