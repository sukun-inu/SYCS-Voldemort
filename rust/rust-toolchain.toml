# Rust 本体の版。手元・CI・Docker のビルドで同じものを使う。
#
# 本番の CPU に合わせた命令セットは rust/.cargo/config.toml（target-cpu=sandybridge）。
#
# 上げるときは、ここと次の 2 箇所を同時に揃えること。
#   rust/tools/voice-check/run.sh       ビルドに使う rust:<版>-slim-bookworm
#   .github/workflows/rust.yml          CI のジョブを動かす container の同じイメージ
#   rust/Cargo.toml                     workspace.package.rust-version
#
# rustup 1.28 から、このファイルを見ても版を自動では入れなくなった。
# 入っていなければ `rustup toolchain install` を rust/ の中で一度打つ。
[toolchain]
channel = "1.100.0"
components = ["rustfmt", "clippy"]
profile = "minimal"
