[package]
name = "voice-check"
version = "0.1.0"
description = "serenity + songbird の Bot が、DAVE 必須の VC で音を届けられるかを人の耳で確かめる道具"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# 版は rust/Cargo.toml の [workspace.dependencies] で決める（= で固定）。この道具の
# 値打ちは「この版の組み合わせで音が届いた」と言えることにあるので、範囲で書かないこと。
# serenity・songbird を上げるときは、まずこの道具で確かめる（手順は README.ja.md）。
[dependencies]
serenity = { workspace = true, features = [
    "builder",
    "cache",
    "client",
    "gateway",
    "model",
    "rustls_backend",
    "voice",
] }
songbird = { workspace = true }
# 合成した WAV を songbird に読ませるため（symphonia の wav / pcm の復号器）。
symphonia = { workspace = true, features = ["wav", "pcm"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
