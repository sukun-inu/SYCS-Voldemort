[package]
name = "voice-check"
version = "0.1.0"
description = "serenity + songbird の Bot が、DAVE 必須の VC で音を届けられるかを人の耳で確かめる道具"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# 版は全部 = で固定する。この道具の値打ちは「この版の組み合わせで音が届いた」と
# 言えることにあるので、範囲で書くと何を確かめたのかが分からなくなる。
# serenity・songbird を上げるときは、まずここを上げてこの道具で確かめる
# （手順は README.ja.md）。
[dependencies]
serenity = { version = "=0.12.5", default-features = false, features = [
    "builder",
    "cache",
    "client",
    "gateway",
    "model",
    "rustls_backend",
    "voice",
] }
songbird = { version = "=0.6.1" }
# 合成した WAV を songbird に読ませるため（symphonia の wav / pcm の復号器）。
symphonia = { version = "=0.5.5", features = ["wav", "pcm"] }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = { version = "=0.1.44" }
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }
