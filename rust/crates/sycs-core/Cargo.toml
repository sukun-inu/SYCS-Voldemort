[package]
name = "sycs-core"
version = "0.1.0"
description = "Rust のプロセスが共通で使う土台（環境変数・接続先・ログ）。Python 側と規則を揃えてある"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# 版は rust/Cargo.toml の [workspace.dependencies] で決める。
[dependencies]
chrono = { workspace = true, features = ["clock", "std"] }
flate2 = { workspace = true }
percent-encoding = { workspace = true }
redis = { workspace = true, features = ["tokio-comp", "connection-manager"] }
serde_json = { workspace = true, features = ["preserve_order"] }
sqlx = { workspace = true, features = ["runtime-tokio", "postgres", "json", "derive"] }
tokio = { workspace = true, features = ["sync", "time", "rt"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "registry", "std"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
