{% extends "base.html" %}
{% block title %}サーバー選択{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <p class="page-kicker">サーバー</p>
    <h1 class="page-title"><i class="bi bi-diagram-3-fill"></i>管理するサーバーを選択</h1>
    <p class="page-description">管理者権限があり、Bot が参加しているサーバーを表示しています。</p>
  </div>
</div>

{% if guilds %}
<div class="guild-grid">
  {% for guild in guilds %}
  <form method="post" action="{{ url_for('dashboard.select_guild') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="guild_id" value="{{ guild.id }}">
    <button type="submit" class="guild-card-button">
      <div class="guild-card">
        {% if guild.icon %}
        <img src="https://cdn.discordapp.com/icons/{{ guild.id }}/{{ guild.icon }}.webp?size=128"
             class="guild-card-icon" width="56" height="56" alt="">
        {% else %}
        <div class="guild-icon-placeholder">{{ guild.name[0] }}</div>
        {% endif %}
        <div class="min-w-0">
          <h2 class="guild-card-title">{{ guild.name }}</h2>
          <div class="guild-card-meta">
            <i class="bi bi-check-circle-fill"></i>
            <span>管理可能</span>
          </div>
        </div>
      </div>
    </button>
  </form>
  {% endfor %}
</div>

{% else %}
<div class="section-card">
  <div class="empty-state">
    <div>
      <i class="bi bi-exclamation-triangle-fill"></i>
      <h2 class="h5">管理可能なサーバーが見つかりません</h2>
      <p class="mb-0">Bot が参加しているサーバーで管理者権限を確認してください。</p>
    </div>
  </div>
</div>
{% endif %}

{% endblock %}
