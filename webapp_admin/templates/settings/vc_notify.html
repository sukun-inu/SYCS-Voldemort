{% extends "base.html" %}
{% block title %}VC 通知{% endblock %}
{% block content %}

<div class="page-header">
  <div>
    <p class="page-kicker">Voice</p>
    <h1 class="page-title"><i class="bi bi-mic-fill"></i>VC 通知</h1>
    <p class="page-description">メンバーの VC 参加・退出・移動を通知するチャンネルを管理します。</p>
  </div>
</div>

<div class="settings-grid">
  <section class="section-card span-6">
    <div class="section-card-header">
      <h2 class="section-card-title"><i class="bi bi-broadcast"></i>通知チャンネル</h2>
    </div>
    <div class="section-card-body">
      <div class="status-strip">
        <span class="status-label">現在</span>
        <span class="status-chip">
          <i class="bi bi-hash"></i>
          {% if current_ch %}{{ current_ch }}{% else %}未設定{% endif %}
        </span>
      </div>

      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-4">
          <label class="form-label" for="vc_notify_channel_id">通知チャンネル</label>
          <select id="vc_notify_channel_id" name="vc_notify_channel_id" class="form-select">
            <option value="0">未設定（無効）</option>
            {% for ch in channels %}
            <option value="{{ ch.id }}" {% if ch.id|string == current_ch|string %}selected{% endif %}>
              # {{ ch.name }}
            </option>
            {% endfor %}
          </select>
          <div class="form-text">ログチャンネルとは別のチャンネルを推奨します。</div>
        </div>
        <div class="form-actions">
          <button class="btn btn-accent"><i class="bi bi-check-lg me-2"></i>保存</button>
        </div>
      </form>
    </div>
  </section>
</div>

{% endblock %}
