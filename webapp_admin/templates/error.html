<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>エラー {{ code }} - SYCS Voldemort</title>
  <link rel="icon" type="image/png"  href="{{ admin_asset_url('favicon.png') }}">
  <link rel="icon" type="image/webp" href="{{ admin_asset_url('admin-icon.webp') }}">
  <link rel="stylesheet" href="{{ admin_asset_url('css/tokens.css') }}">
  <link rel="stylesheet" href="{{ admin_asset_url('css/base.css') }}">
  <link rel="stylesheet" href="{{ admin_asset_url('css/components.css') }}">
  <link rel="stylesheet" href="{{ admin_asset_url('css/page.css') }}">
</head>
<body class="aero-page">
<main class="error-page">
  <section class="error-card lens" data-specular>
    <p class="error-code">{{ code }}</p>
    <h1 class="error-message">{{ message }}</h1>
    <p class="muted small">{{ description or "リクエストを処理できませんでした。" }}</p>
    <div class="error-actions">
      {# javascript: の疑似URLも onclick="" も、CSP（script-src 'self'、
         'unsafe-inline' も 'unsafe-hashes' も無い）に塞がれて押しても何も
         起きない。動きは data-history-back を目印に aero.js から結び付ける。
         JS が動かない環境では、このボタンごと出さない（下の hidden）。 #}
      <button class="btn" type="button" data-history-back hidden>{{ icon('arrow-left') }}前のページへ</button>
      <a class="btn btn-primary" href="{{ url_for('dashboard.index') }}">{{ icon('house-fill') }}管理画面へ</a>
    </div>
  </section>
</main>
<script type="module" src="{{ admin_asset_url('js/aero.js') }}"></script>
</body>
</html>
