{% extends "base.html" %}
{% block title %}エラー {{ code }}{% endblock %}
{% block content %}
<div class="text-center py-5">
  <h1 class="display-1 fw-bold" style="color:var(--accent)">{{ code }}</h1>
  <p class="lead">{{ message }}</p>
  <a href="{{ url_for('dashboard.index') }}" class="btn btn-accent mt-3">
    <i class="bi bi-house-fill me-2"></i>ダッシュボードへ戻る
  </a>
</div>
{% endblock %}
