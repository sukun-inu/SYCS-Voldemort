{% extends "base.html" %}
{% block title %}エラー {{ code }}{% endblock %}
{% block content %}

<div class="error-view">
  <section class="error-panel">
    <div class="error-icon">
      <i class="bi bi-exclamation-triangle-fill"></i>
    </div>
    <h1 class="error-code">{{ code }}</h1>
    <h2 class="error-message">{{ message }}</h2>
    <p class="page-description">リクエストを処理できませんでした。</p>

    {% if description %}
    <div class="info-panel mt-4 text-start">
      <p class="mb-0">{{ description }}</p>
    </div>
    {% endif %}

    <div class="error-actions">
      <a href="javascript:history.back()" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left me-2"></i>前のページに戻る
      </a>
      <a href="{{ url_for('dashboard.index') }}" class="btn btn-accent">
        <i class="bi bi-house-fill me-2"></i>ダッシュボードへ戻る
      </a>
    </div>
  </section>
</div>

{% endblock %}
