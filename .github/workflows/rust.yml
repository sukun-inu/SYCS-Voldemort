name: Rust

# rust/ の検査。Python の「テスト」（tests.yml）とは別の workflow にしてある。
# 片方が落ちたときに、どちらが落ちたのかを一覧で見分けられるようにするため。
#
# paths で絞っていない。絞ると、rust/ を触らない commit には check run が付かず、
# 「CI で通っていない commit が main の先頭に残る」状態を作りうる（tests.yml の
# workflow_dispatch のコメントと同じ理由）。数分で終わるので毎回回す。
on:
  push:
    branches:
      - main
  pull_request:
  # 手で回せるようにしてある（gh workflow run Rust --ref main）。理由は tests.yml と同じ。
  workflow_dispatch:

jobs:
  rust:
    name: fmt・clippy・テスト
    runs-on: ubuntu-latest
    # **本番と同じイメージの中で回す。** runner（ubuntu-latest = Ubuntu 26.04）の glibc
    # 自体が x86-64-v3 を要求するので、runner の上ではテストを Sandy Bridge のふりで
    # 動かせない（"Fatal glibc error: CPU does not support x86-64-v3"）。このイメージの
    # 版は rust/rust-toolchain.toml と揃えること。
    container: rust:1.100.0-slim-bookworm
    # 本物の Postgres（本番と同じ 16）。sycs-core の tests/postgres.rs が使う。
    # SQLite での代用はしない。LISTEN/NOTIFY と FOR UPDATE SKIP LOCKED は Postgres に
    # しか無く、代用すると効いているかを確かめられない。
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-only
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: rust
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v7

      - name: Rust を入れる（rust/rust-toolchain.toml の版）
        # イメージに同じ版が入っているので、ここでは rustfmt と clippy が足される。
        # rustup 1.28 から、toolchain ファイルを見ても自動では入れなくなった。
        # 引数なしの install がファイルの版（と components）を入れる。
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      - name: songbird のビルドに要るものと QEMU とフォントを入れる
        # songbird が使う opus2 は libopus を pkg-config で探し、無ければ cmake で
        # 自前ビルドする。どちらの経路でも通るように両方入れておく。
        # qemu-user はテストを本番の CPU（Sandy Bridge）のふりで動かすため。
        # fonts-noto-cjk は地震の画像の文字（crates/sycs-text）のテストが読む。Python の本番の
        # イメージ（python:3.13-slim の apt）と同じファイルであること（テストがハッシュで確かめる）。
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends libopus-dev cmake pkg-config qemu-user fonts-noto-cjk

      - name: 整形の確認（cargo fmt）
        run: cargo fmt --all --check

      - name: lint（clippy。警告も落とす）
        # --locked は Cargo.lock を書き換えさせない。Cargo.toml を = で固定していても、
        # 間接の依存は Cargo.lock でしか固定されていない。
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: テスト（本番の CPU のふりで動かす）
        # ビルドは rust/.cargo/config.toml で target-cpu=sandybridge に絞ってある。
        # それでも依存の build.rs が C のコードを「ビルドした機械の CPU」向けに
        # 組むことがあるので、テストの実行そのものを QEMU の Sandy Bridge のふりで行う。
        # この QEMU が AVX2 を本当に弾くことは、同じ runner で「テスト」の
        # tools/check_cpu_baseline.py が対照実験で確かめている。
        #
        # Postgres が要るテストは、手元の cargo test では飛ばす（#[ignore]）。ここでは
        # --include-ignored で必ず回す。接続先が無ければテストが落ちる（素通りさせない）。
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: qemu-x86_64 -cpu SandyBridge
          SYCS_TEST_DATABASE_URL: postgres://postgres:ci-only@postgres:5432/postgres
        run: cargo test --locked -- --include-ignored

      - name: シェルスクリプトの構文検査
        run: |
          for f in tools/*/*.sh; do
            echo "--- $f"
            sh -n "$f"
          done

  image:
    name: Bot のイメージ（本番の CPU で起動できるか・main なら GHCR に置く）
    # runner の上で docker build する（上の rust ジョブはコンテナの中なので docker が無い）。
    # cpu-check の段が、動かす段と同じ中身を QEMU の Sandy Bridge のふりで起動する。
    # 段の中身と理由は docker/bot-rs.Dockerfile。
    #
    # main への push のときは、動かす段のイメージを GHCR（ghcr.io/<持ち主>/sycs-voldemort-bot-rs）に置く。
    # 本番はこれを取ってくるだけで、本番のサーバーでは Rust をコンパイルしない（切り替えは docs/UPGRADE.ja.md の 5.）。
    # **テスト（rust ジョブ）が通ってから置く**（needs）。落ちた版を本番が取ってこないように。
    # 名札は :main（いちばん新しい main）と :sha-<コミット>（版を決め打ちにしたいとき・戻したいとき）。
    needs: rust
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v7

      - name: ビルドして、本番の CPU のふりで起動する
        run: docker build -f docker/bot-rs.Dockerfile --target cpu-check -t sycs-bot-rs:cpu-check .

      - name: 動かす段のイメージを作る（上と同じ層を使うので、ほとんど作り直さない）
        # source のラベルで、GHCR のパッケージがこのリポジトリにつながる（書く権限をリポジトリから引き継ぐ）。
        run: >-
          docker build -f docker/bot-rs.Dockerfile
          --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}"
          --label "org.opencontainers.image.revision=${{ github.sha }}"
          -t sycs-bot-rs:final .

      - name: GHCR に置く（main への push のときだけ）
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: |
          # GHCR の名前は小文字でなければならない（持ち主の名前に大文字が入っていても通るように）。
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/$owner/sycs-voldemort-bot-rs"
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          for tag in main "sha-$SHA"; do
            docker tag sycs-bot-rs:final "$image:$tag"
            docker push "$image:$tag"
          done

  web-images:
    name: 配信（Rust）と nginx のイメージ（本番の CPU で起動できるか・つないで確かめる・main なら GHCR に置く）
    # image ジョブと同じ作り。配信（rust/apps/cdn）は docker/cdn-rs.Dockerfile、nginx は docker/nginx/Dockerfile。
    # それぞれの cpu-check の段が、動かす段と同じ中身を QEMU の Sandy Bridge のふりで起動する（配信は自分に 1 回
    # 尋ねるところまで、nginx は設定を読ませるところまで）。そのあと、2 つを本当につないで、配信のリンク・内側の場所・
    # 静的ファイルの見出しを確かめる（docker/nginx/smoke.sh）。
    #
    # main への push のときは GHCR（ghcr.io/<持ち主>/sycs-voldemort-cdn-rs・sycs-voldemort-nginx）に置く。名札は
    # :main と :sha-<コミット>。本番は compose の profile nginx で取ってくる（既定では起動しない。docs/UPGRADE.ja.md の 6.）。
    # **テスト（rust ジョブ）が通ってから置く**（needs）。
    needs: rust
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v7

      - name: 配信をビルドして、本番の CPU のふりで起動する
        run: docker build -f docker/cdn-rs.Dockerfile --target cpu-check -t sycs-cdn-rs:cpu-check .

      - name: 配信の動かす段のイメージを作る（上と同じ層を使うので、ほとんど作り直さない）
        run: >-
          docker build -f docker/cdn-rs.Dockerfile
          --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}"
          --label "org.opencontainers.image.revision=${{ github.sha }}"
          -t sycs-cdn-rs:final .

      - name: nginx をビルドして、本番の CPU のふりで設定を読ませる
        run: docker build -f docker/nginx/Dockerfile --target cpu-check -t sycs-nginx:cpu-check .

      - name: nginx の動かす段のイメージを作る
        run: >-
          docker build -f docker/nginx/Dockerfile
          --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}"
          --label "org.opencontainers.image.revision=${{ github.sha }}"
          -t sycs-nginx:final .

      - name: nginx と配信をつないで確かめる
        run: sh docker/nginx/smoke.sh sycs-nginx:final sycs-cdn-rs:final

      - name: GHCR に置く（main への push のときだけ）
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: |
          # GHCR の名前は小文字でなければならない（持ち主の名前に大文字が入っていても通るように）。
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          for pair in "sycs-cdn-rs:final sycs-voldemort-cdn-rs" "sycs-nginx:final sycs-voldemort-nginx"; do
            local_image=${pair% *}
            image="ghcr.io/$owner/${pair#* }"
            for tag in main "sha-$SHA"; do
              docker tag "$local_image" "$image:$tag"
              docker push "$image:$tag"
            done
          done
