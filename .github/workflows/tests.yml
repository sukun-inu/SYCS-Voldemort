name: テスト

# main への push と、すべての pull request で実行する。
# pytest は入っていない前提のリポジトリなので、テストは必ず unittest で回す。
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: unittest とリポジトリ自作チェッカー
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v7

      - name: Python 3.11 をセットアップ
        # Dockerfile（python:3.11-slim）とバージョンを揃える。ここがずれると
        # 「ローカル・CI では通るのに本番だけ壊れる」が起きうる。
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: ffmpeg をインストール
        # tests/test_services.py の録音関連テストは ffmpeg を実際に起動して
        # トラックの中身を検証する（モックしていない）。
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: ffmpeg の素性を控える
        # 録音は libmp3lame で mp3 に符号化する。手元（Windows）と CI で
        # ビルドが違うため、符号化器が入っているかどうかをログに残しておく。
        # 落ちたときにここを見れば、環境の問題かコードの問題かが切り分けられる。
        run: |
          ffmpeg -hide_banner -version | head -3
          echo "--- mp3 の符号化器 ---"
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -i mp3 || echo "mp3 の符号化器が見つからない"

      - name: 依存関係をインストール
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: lint（ruff）
        # 設定は pyproject.toml。複雑度の上限は「今より悪くしない」ための
        # 天井であって目標値ではない（詳細はそちらのコメント）。
        run: python -m ruff check .

      - name: 整形の確認（black）
        # 整形し直す差分が出たら落とす。手元では python -m black . を実行する。
        run: python -m black --check --diff .

      - name: 型検査（mypy）
        # 本体5パッケージすべてが対象になった（147ファイル）。新しく
        # パッケージを足すときは、そのパッケージの指摘を 0 にしてから
        # ここへ加えること。「入れたが素通り」は作らない。
        run: python -m mypy -p webapp -p events -p services -p webapp_admin -p commands

      - name: シェルスクリプトの構文検査
        # バックアップのスクリプトを compose の YAML の中ではなくファイルに
        # 置いたのは、ここで検査に掛けられるようにするためでもある（YAML の中の
        # シェルは構文検査に掛けられない）。検査できる形にしたなら、必ず検査する。
        run: |
          for f in docker/*.sh; do
            echo "--- $f"
            sh -n "$f"
          done

      - name: 依存の固定が Docker と同じ条件で解けるか確認
        run: python tools/check_requirements.py

      - name: 依存に既知の脆弱性が無いか確認（pip-audit）
        # requirements.txt を全部 == で固定しているのと対で要る。固定は「勝手に
        # 動かない」ことしか保証せず、固定したまま古くなったものが放置される側の
        # 危険は増える。入れた初回で Pillow 12.2.0 の勧告11件を見つけた。
        #
        # PYTHONUTF8=1 が必要。pip-audit の requirements パーサは
        # locale.getpreferredencoding() でファイルを復号するため、日本語ロケールの
        # Windows（cp932）だと requirements.txt の日本語コメントで
        # UnicodeDecodeError になる。CI（ubuntu）だけ通って手元で通らない状態は
        # 「手元と CI を同じ条件にする」方針に反するので、両方で効く形にしておく。
        #
        # --strict は「監査できなかった依存があったら落とす」。黙って飛ばされると
        # 緑なのに何も見ていない状態になる（CONTRIBUTING 8. と同じ理由）。
        #
        # --ignore-vuln を足すときは、**必ずここに理由と外せる条件を書くこと。**
        # 書かずに足すと、次に見る人には「無視してよい」と「無視するしかない」の
        # 区別が付かない。
        #
        #   PYSEC-2026-3002（PyNaCl 1.5.0 / CVE-2025-69277）
        #     同梱 libsodium の crypto_core_ed25519_is_valid_point が、主部分群に
        #     無い点を通すことがある。CVSS は AV:L/AC:H/C:L/I:L。
        #     このリポジトリは PyNaCl を discord.py の音声暗号化経由でしか使わず、
        #     この関数を呼ぶ経路が無い。
        #     **直せない。** discord.py[voice] が PyNaCl<1.6 を要求し、修正版は
        #     1.6.2 から。しかも discord.py 2.7.1 は現時点の最新で、制約を緩めた
        #     版がまだ無い（requirements.txt の PyNaCl のコメントも参照）。
        #     外せる条件: discord.py が PyNaCl 1.6 系を許す版を出したとき。
        #     そのときは音声の送受信と録音の動作確認をしてから上げること。
        env:
          PYTHONUTF8: "1"
        run: |
          python -m pip_audit -r requirements.txt --strict \
            --ignore-vuln PYSEC-2026-3002

      - name: 管理UIの設定スキーマを検証
        run: python tools/check_admin_schema.py

      - name: 管理UIのドキュメントがスキーマと一致しているか確認
        run: python tools/generate_admin_docs.py --check

      - name: docstring の充足率が下限を割っていないか確認
        # 下限は 100。この検査が守れるのは「書く場所が空でない」ことだけで、
        # 中身の良し悪しは見られない（スクリプトの docstring 参照）。数を
        # 保つための歯止めであって、質はここでは担保できていない。
        run: python tools/check_docstrings.py

      - name: テストをカバレッジ付きで実行
        run: python -m coverage run -m unittest discover -s tests -t .

      - name: カバレッジレポートを作成（下限を割ったらここで落とす）
        if: always()
        # set -o pipefail が要る。GitHub Actions の既定シェルは bash -e だが
        # pipefail は入っておらず、`coverage report | tee` だとパイプ全体の
        # 終了コードが tee のもの（常に 0）になる。.coveragerc の fail_under が
        # 効かず、カバレッジが下がっても緑のまま通ってしまう。
        run: |
          set -o pipefail
          python -m coverage report -m | tee coverage-report.txt

      - name: カバレッジレポートをサマリへ書き出す
        if: always()
        run: |
          {
            echo "## カバレッジレポート"
            echo ""
            echo '```'
            cat coverage-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
