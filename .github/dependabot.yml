# 依存の更新を Dependabot に見張らせる。
#
# ■ なぜ要るか
#
# requirements.txt は再現性のために全部 == で固定してある。固定は「コードを1行も
# 触っていないのに docker build が壊れる」を防ぐが、代わりに**上げどきを知る手段が
# 無くなる。** 誰も気づかないまま古くなり、放置されている期間だけ危険が積む。
# 固定する方針と、上げどきを教える仕組みは対で置く必要がある。
#
# 脆弱性そのものは CI の pip-audit が落とす。こちらは「落ちる前に上げる」ための口。
#
# ■ まとめて1つの PR にしている理由
#
# 29 個の依存を個別に PR にすると、そのたびに CI が8条件ぶん回り、履歴も
# 「chore(deps): bump X」で埋まる。このリポジトリでいちばん価値があるのは原因まで
# 書いてある履歴なので、そこを薄めたくない。まとめて受け取って、上げるときは
# requirements.txt のコメントに理由を書いた1コミットにする（CONTRIBUTING 3.）。
version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    groups:
      # 本番の依存。上げると Bot と Web の挙動が変わりうるので、まとめて1つ。
      production:
        patterns: ["*"]
        exclude-patterns: ["ruff", "black", "mypy", "coverage", "pip-audit"]
      # 開発用。落ちても本番には出ないので、まとめて受け取ってよい。
      development:
        patterns: ["ruff", "black", "mypy", "coverage", "pip-audit"]
    commit-message:
      prefix: "chore"
      include: scope
    ignore:
      # ここに足すときは、**必ず理由と外せる条件を書くこと。** 書かずに足すと、
      # 次に見る人には「上げてはいけない」と「まだ上げられない」の区別が付かない。
      #
      # なお、ここに書き忘れても CI は落ちる（tools/check_requirements.py が
      # Python の対応版と依存の衝突を検出する）。**この ignore は「解決不能な PR を
      # 開かせない」ためのもので、守りの本体ではない。** 守りは CI 側にある。

      # discord.py[voice] が PyNaCl<1.6 を要求するため、1.6 系へは上げられない。
      #
      # 外せる条件: discord.py が PyNaCl 1.6 系を許す版を出したとき。詳細は
      # requirements.txt の PyNaCl のコメントと、tests.yml の pip-audit の
      # --ignore-vuln の説明にある。
      - dependency-name: PyNaCl
        versions: [">=1.6"]

      # numpy 2.5 系は Requires-Python >=3.12。本番と CI は 3.11（Dockerfile と
      # 揃えてある）なので、pip install が「No matching distribution found」で
      # 落ちる。**実際に最初の Dependabot PR がこれで落ちた。**
      #
      # Dependabot は Dockerfile の FROM を読まないので、対象の Python が
      # 3.11 だと知らない。.python-version を置いて伝えてはあるが、確実なのは
      # こちらの明示なので両方入れてある。
      #
      # 外せる条件: Dockerfile の Python を 3.12 以上へ上げたとき。そのときは
      # tests.yml の setup-python と pyproject.toml の target-version /
      # python_version も同時に上げること（片方だけ動かすと、このリポジトリが
      # 何度も踏んできた「手元では通るのに本番だけ壊れる」に戻る）。
      - dependency-name: numpy
        versions: [">=2.5"]

      # redis 8 系は limits の redis ストレージ（`redis<8.0.0`）と衝突する。
      # 上げると管理画面のレート制限を Valkey へ載せられなくなる。
      #
      # **これも実際に最初の PR に入っていた。** しかも当時は pip install も
      # テストも check_requirements も通ってしまい、本番でレート制限が Valkey を
      # 触った瞬間にだけ壊れる形だった。requirements.txt へ limits[redis] を
      # 明示したので、今は CI が検出する。
      #
      # 外せる条件: limits が redis 8 系を許す版を出したとき。
      #
      # `">=8"` と書いたら効かなかった（recreate させても redis==8.1.0 のままの PR が
      # 出てきた）。パッチまで書いた `">=8.0.0"` にすること。numpy 側の `">=2.5"` は
      # 効いていたので、桁数の揺れに耐えない書き方らしい。**効いているかどうかは、
      # 出てくる PR を見るまで分からない。**
      - dependency-name: redis
        versions: [">=8.0.0"]
      # discord.py 本体を上げると音声接続と録音の検証が必須になる（DAVE の鍵交換と
      # voice_recv の組み合わせが版に依存する）。手動で上げる前提にして、自動 PR は
      # メジャー・マイナーだけ抑える。パッチは受け取る。
      - dependency-name: discord.py
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # discord-ext-voice-recv は上流がまだ alpha で、上げるたびに録音の動作確認が
      # 要る（requirements.txt のコメント参照）。自動では上げない。
      - dependency-name: discord-ext-voice-recv

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Asia/Tokyo
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
      include: scope
