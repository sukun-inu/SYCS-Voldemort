services:
  postgres-secret-init:
    image: alpine:3.21
    container_name: sycs-voldemort-postgres-secret-init
    restart: "no"
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        mkdir -p /shared
        if [ ! -s /shared/postgres_password ]; then
          tr -dc 'A-Za-z0-9' </dev/urandom | head -c 48 > /shared/postgres_password
          chmod 600 /shared/postgres_password
          echo "Generated PostgreSQL password at first startup."
        else
          echo "PostgreSQL password already exists. Reusing it."
        fi
    volumes:
      - shared_secrets:/shared

  postgres:
    image: postgres:16-alpine
    container_name: sycs-voldemort-postgres
    restart: unless-stopped
    depends_on:
      postgres-secret-init:
        condition: service_completed_successfully
    environment:
      - TZ=Asia/Tokyo
      - POSTGRES_USER=${POSTGRES_USER:-metal_user}
      - POSTGRES_DB=${POSTGRES_DB:-metal_prices}
      - POSTGRES_PASSWORD_FILE=/shared/postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - shared_secrets:/shared:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-metal_user} -d ${POSTGRES_DB:-metal_prices}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-user-state-init:
    image: postgres:16-alpine
    container_name: sycs-voldemort-postgres-user-state-init
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-secret-init:
        condition: service_completed_successfully
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        DB_NAME="${USER_STATE_POSTGRES_DB:-user_state_audit}"
        case "$$DB_NAME" in
          ''|*[!A-Za-z0-9_]*)
            echo "Invalid USER_STATE_POSTGRES_DB: $$DB_NAME" >&2
            exit 1
            ;;
        esac
        export PGPASSWORD="$(cat /shared/postgres_password)"
        EXISTS="$(psql -h postgres -U "${POSTGRES_USER:-metal_user}" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$$DB_NAME'")"
        if [ "$$EXISTS" = "1" ]; then
          echo "User state database already exists: $$DB_NAME"
        else
          psql -h postgres -U "${POSTGRES_USER:-metal_user}" -d postgres -c "CREATE DATABASE \"$$DB_NAME\""
          echo "Created user state database: $$DB_NAME"
        fi
    volumes:
      - shared_secrets:/shared:ro

  # プロセスをまたいで共有する状態の置き場。
  #
  # ■ なぜ要るか
  #
  # 3つのアプリ（bot / admin / web）が別プロセスで、web は既定で2ワーカー動く。
  # そのため次の3つが「プロセスごとに独立」していた。
  #
  #   API 応答のキャッシュ  同じ問い合わせに対して同じ DB クエリと同じ予測計算が
  #                         ワーカーの数だけ走り、期限切れの時刻もずれる。
  #   レート制限            memory:// だとワーカーごとに数えるので、2ワーカーなら
  #                         実質2倍通る。ADMIN_WORKERS のコメントに「2以上にする
  #                         場合は Redis を指定すること」とだけ書かれていた。
  #   メトリクス            スクレイプがワーカー1個にしか当たらず取りこぼす。
  #
  # ■ なぜ Redis ではなく Valkey なのか
  #
  # BSD ライセンス。Redis は 7.4 系で RSALv2/SSPL へ変わった経緯があり、8 系で
  # AGPLv3 に戻っている。このリポジトリは LICENSES/ と THIRD_PARTY_NOTICES.md を
  # 維持しているので、追記が要らない側を選んだ。プロトコルは互換なので、
  # アプリ側は redis-py のまま。
  #
  # ■ 永続化しない理由
  #
  # ここに入るのは全部「消えても作り直せるもの」だけ。appendonly を有効にすると
  # 消えて困るものをここへ置きたくなり、バックアップで守る対象が増える。消えて
  # 困るものは Postgres に入れること。
  valkey:
    image: valkey/valkey:8-alpine
    container_name: sycs-voldemort-valkey
    restart: unless-stopped
    command:
      - valkey-server
      - --appendonly
      - "no"
      - --save
      - ""
      # 上限に当たったら古いものから捨てる。これを付けないと、上限に達した
      # 時点で書き込みがエラーになる（キャッシュとしては捨ててほしい）。
      - --maxmemory
      - ${VALKEY_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - allkeys-lru
    environment:
      - TZ=Asia/Tokyo
    # ポートはホストへ出さない。同じ compose ネットワークの中からしか触らせない。
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 128
    mem_limit: 384m

  # Postgres の日次バックアップ。中身は docker/postgres-backup.sh（なぜ YAML の
  # 中に直接書かなかったか、なぜ専用イメージを使わないかは、そちらの冒頭に書いた）。
  #
  # 取ったものは postgres_backups ボリュームに入る。**ホストの外へ運ぶ仕組みは
  # ここには無い。** 同じディスクにしか無いバックアップは、ディスクが死んだ日に
  # 一緒に死ぬ。ボリュームを別の場所へ持ち出す手順は docs/BACKUP.ja.md に書いた。
  postgres-backup:
    image: postgres:16-alpine
    container_name: sycs-voldemort-postgres-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      postgres-secret-init:
        condition: service_completed_successfully
      postgres-user-state-init:
        condition: service_completed_successfully
    # postgres イメージの既定の entrypoint（docker-entrypoint.sh）は「サーバーを
    # 起動する」ためのものなので、command だけ差し替えても意図通りにならない。
    entrypoint: ["/bin/sh", "/usr/local/bin/postgres-backup.sh"]
    environment:
      - TZ=Asia/Tokyo
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-metal_user}
      - POSTGRES_DB=${POSTGRES_DB:-metal_prices}
      - USER_STATE_POSTGRES_DB=${USER_STATE_POSTGRES_DB:-user_state_audit}
      - POSTGRES_PASSWORD_FILE=/shared/postgres_password
      - BACKUP_DIR=/backups
      # 14日分。1日あたりのダンプは3ファイル（本体・利用者状態・ロール）。
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-14}
      - BACKUP_HOUR_JST=${BACKUP_HOUR_JST:-4}
      # if-stale / always / never。既定は if-stale で、最新のダンプが
      # BACKUP_STALE_HOURS より古いときだけ起動時にも1本取る。
      - BACKUP_RUN_ON_START=${BACKUP_RUN_ON_START:-if-stale}
      - BACKUP_STALE_HOURS=${BACKUP_STALE_HOURS:-20}
      # settings.json（app_data）と VAPID の鍵（shared_secrets）も一緒に取る。
      # どちらも Postgres に入っておらず、失うと作り直せない（詳細は
      # docker/postgres-backup.sh の dump_files のコメント）。
      - BACKUP_FILES=${BACKUP_FILES:-true}
      - DATA_DIR=/app/data
      - SECRETS_DIR=/shared
    volumes:
      - postgres_backups:/backups
      - shared_secrets:/shared:ro
      # 読み取り専用で付ける。バックアップを取る側が書けてしまう必要は無く、
      # 付け間違いで本番の設定を壊す余地を残さない。
      - app_data:/app/data:ro
      # スクリプトは読み取り専用で渡す。イメージに焼かないのは、直したときに
      # docker build をせず compose の再作成だけで反映させたいため。
      - ./docker/postgres-backup.sh:/usr/local/bin/postgres-backup.sh:ro
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 64
    mem_limit: 256m

  sycs-voldemort:
    build:
      context: .
    container_name: sycs-voldemort
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      postgres-secret-init:
        condition: service_completed_successfully
      postgres-user-state-init:
        condition: service_completed_successfully
      # web / admin と同じ理由で service_started（healthy を待たない）。
      valkey:
        condition: service_started
    environment:
      - TZ=Asia/Tokyo
      # Bot は HTTP サーバーを持たないので、Netdata から直接は測れない。
      # 30秒ごとに Valkey へ心拍と数値を置き、管理画面の /metrics が出す。
      # **ここを空にすると sycs_up{app="bot"} が出なくなる**（Bot の死活が
      # 分からなくなる。キャッシュと違って、無くても困らない類ではない）。
      - VALKEY_URL=${VALKEY_URL:-redis://valkey:6379/0}
      - METRICS_REPORT_INTERVAL_SECONDS=${METRICS_REPORT_INTERVAL_SECONDS:-30}
      # Discord Bot は環境変数でトークンを渡す
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - METALPRICE_API_KEY=${METALPRICE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY}
      - VT_MAX_DOWNLOAD_BYTES=${VT_MAX_DOWNLOAD_BYTES:-20971520}
      # Bot 設定ファイルの保存先（ボリュームマウント先に合わせる）
      - SETTINGS_DIR=/app/data
      - SETTINGS_LOCK_TIMEOUT_SECONDS=${SETTINGS_LOCK_TIMEOUT_SECONDS:-10}
      - SETTINGS_LOCK_STALE_SECONDS=${SETTINGS_LOCK_STALE_SECONDS:-30}
      # ログは日付で1日1ファイル。既定 3650 日（10年）保管し、回した分は gzip で畳む。
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-3650}
      # マルチインスタンス時: 背景ジョブ担当のみ true
      - BOT_BACKGROUND_WORKER=${BOT_BACKGROUND_WORKER:-true}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-metal_prices}
      - POSTGRES_USER=${POSTGRES_USER:-metal_user}
      - POSTGRES_PASSWORD_FILE=/shared/postgres_password
      - USER_STATE_POSTGRES_DB=${USER_STATE_POSTGRES_DB:-user_state_audit}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-5}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-10}
      - DB_POOL_TIMEOUT=${DB_POOL_TIMEOUT:-30}
      - DB_POOL_RECYCLE=${DB_POOL_RECYCLE:-1800}
      - USER_STATE_SYNC_ON_READY=${USER_STATE_SYNC_ON_READY:-true}
      - USER_STATE_SYNC_DELAY_SECONDS=${USER_STATE_SYNC_DELAY_SECONDS:-20}
      - USER_STATE_SYNC_GUILD_PAUSE_SECONDS=${USER_STATE_SYNC_GUILD_PAUSE_SECONDS:-1.0}
      - USER_STATE_SYNC_MAX_MEMBERS_PER_GUILD=${USER_STATE_SYNC_MAX_MEMBERS_PER_GUILD:-0}
      - USER_STATE_AUTO_REPAIR_ENABLED=${USER_STATE_AUTO_REPAIR_ENABLED:-true}
      - USER_STATE_AUTO_REPAIR_INTERVAL_SECONDS=${USER_STATE_AUTO_REPAIR_INTERVAL_SECONDS:-1800}
      - USER_STATE_AUTO_REPAIR_START_DELAY_SECONDS=${USER_STATE_AUTO_REPAIR_START_DELAY_SECONDS:-180}
      - USER_STATE_AUTO_REPAIR_MAX_ROWS_PER_GUILD=${USER_STATE_AUTO_REPAIR_MAX_ROWS_PER_GUILD:-50000}
      - USER_STATE_AUTO_REPAIR_WRITE_EVENTS=${USER_STATE_AUTO_REPAIR_WRITE_EVENTS:-false}
      - USER_STATE_RETENTION_DAYS=${USER_STATE_RETENTION_DAYS:-3650}
      - USER_STATE_CLEANUP_INTERVAL_SECONDS=${USER_STATE_CLEANUP_INTERVAL_SECONDS:-21600}
      # DJAudio-DL: Discord に貼る MP3 ダウンロード URL のベース（外部からアクセス可能な admin の URL）
      - DJAUDIO_BASE_URL=${DJAUDIO_BASE_URL:-http://localhost:5001}
      # TTS: macOS TTS API サーバーの URL
      - TTS_BASE_URL=${TTS_BASE_URL:-http://localhost:8080}
    volumes:
      - app_data:/app/data
      - shared_secrets:/shared:ro
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 512
    mem_limit: 1g

  sycs-voldemort-admin:
    build:
      context: .
    container_name: sycs-voldemort-admin
    restart: unless-stopped
    command: python admin_main.py
    depends_on:
      postgres:
        condition: service_healthy
      postgres-secret-init:
        condition: service_completed_successfully
      postgres-user-state-init:
        condition: service_completed_successfully
      # web と同じ理由で service_started（healthy を待たない）。レート制限は
      # swallow_errors と in_memory_fallback で degrade するようにしてあるので、
      # Valkey が無くても管理画面は使える。
      valkey:
        condition: service_started
    ports:
      - "${ADMIN_HOST_PORT:-5001}:5001"
    environment:
      - TZ=Asia/Tokyo
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
      - DISCORD_REDIRECT_URI=${DISCORD_REDIRECT_URI:-http://localhost:5001/admin/callback}
      - ADMIN_FLASK_SECRET_KEY=${ADMIN_FLASK_SECRET_KEY}
      # DEV 環境変数チェッカーで Bot 側APIキー状態も確認できるように引き渡す
      - METALPRICE_API_KEY=${METALPRICE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY}
      - DEV_USER_ID=${DEV_USER_ID:-}
      # TTS: macOS TTS API サーバーの URL（声一覧取得に使用）
      - TTS_BASE_URL=${TTS_BASE_URL:-http://localhost:8080}
      - FLASK_SECURE_COOKIES=${FLASK_SECURE_COOKIES:-false}
      - ADMIN_ASSET_VERSION=${ADMIN_ASSET_VERSION:-20260509-favicon-seo}
      # レート制限は Valkey に置く。memory:// だとワーカーごとに数えるので、
      # ADMIN_WORKERS を2以上にした瞬間に実質2倍通る。
      #
      # slowapi 0.1.10 は非同期ストレージに対応していないので、ここで指定した
      # Redis への読み書きは同期呼び出しになり、そのぶんイベントループが止まる。
      # ローカルの Valkey なら1回あたり1ミリ秒未満で、ADMIN_TPS_TARGET=50 の
      # 規模では問題にならない。**外部の Redis を指定すると、往復のぶん全部の
      # リクエストが遅くなる。** ここは同じホストの中に置くこと。
      #
      # クエリの socket_timeout を消さないこと。redis-py はこれを float として
      # 解釈する。省くと、Valkey が「繋がったまま応答しない」状態になったときに
      # 全リクエストがそこで止まる（繋がらないより、この状態のほうが危ない）。
      - ADMIN_LIMITER_STORAGE_URI=${ADMIN_LIMITER_STORAGE_URI:-redis://valkey:6379/1?socket_timeout=0.5&socket_connect_timeout=0.5}
      # 共有キャッシュとメトリクスは 0 番、レート制限は 1 番を使う。分けているのは
      # レート制限の状態を消したいときに、キャッシュまで消さずに済むようにするため。
      - VALKEY_URL=${VALKEY_URL:-redis://valkey:6379/0}
      # Netdata が読む /metrics の設定。
      #
      # 認証の代わりに接続元 IP で絞る（Netdata はログインできない）。既定は
      # ループバックと Docker のブリッジ帯。**転送ヘッダは一切見ていない**ので、
      # ここを広げた範囲からしか読めない（webapp_admin/prometheus_view.py 参照）。
      - METRICS_ALLOWED_CIDRS=${METRICS_ALLOWED_CIDRS:-127.0.0.1/32,::1/128,172.16.0.0/12}
      - METRICS_REPORT_INTERVAL_SECONDS=${METRICS_REPORT_INTERVAL_SECONDS:-30}
      # 心拍がこれより古いアプリは sycs_up=0 になる。報告間隔の3倍を目安にする。
      - METRICS_STALE_AFTER_SECONDS=${METRICS_STALE_AFTER_SECONDS:-90}
      - BACKUP_STATUS_FILE=/backups/status.json
      # メトリクスと監視スレッドはワーカーごとに独立するため、既定は1。
      # **/metrics はこのプロセスから出るので、ここを2以上にすると Netdata の
      # スクレイプがワーカー1個にしか当たらなくなる**（Valkey に集めた値は
      # どのワーカーからでも同じに見えるが、admin_request_tps だけは
      # そのワーカーぶんになる）。
      - ADMIN_WORKERS=${ADMIN_WORKERS:-1}
      - ADMIN_TPS_TARGET=${ADMIN_TPS_TARGET:-50}
      - ADMIN_MONITOR_INTERVAL_SECONDS=${ADMIN_MONITOR_INTERVAL_SECONDS:-30}
      - ADMIN_DOWNTIME_GRACE_SECONDS=${ADMIN_DOWNTIME_GRACE_SECONDS:-120}
      - ADMIN_CPU_ALERT_PERCENT=${ADMIN_CPU_ALERT_PERCENT:-90}
      - ADMIN_MEMORY_ALERT_PERCENT=${ADMIN_MEMORY_ALERT_PERCENT:-90}
      - ADMIN_TPS_ALERT_PERCENT=${ADMIN_TPS_ALERT_PERCENT:-100}
      - SETTINGS_DIR=/app/data
      - SETTINGS_LOCK_TIMEOUT_SECONDS=${SETTINGS_LOCK_TIMEOUT_SECONDS:-10}
      - SETTINGS_LOCK_STALE_SECONDS=${SETTINGS_LOCK_STALE_SECONDS:-30}
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-3650}
      # リバースプロキシ経由だと接続元が 127.0.0.1 になる。ここに書いた帯域から
      # 来たときだけ X-Forwarded-For を信じ、本当のアクセス元をログに残す。
      # **広げると、外から直接ヘッダを偽装するだけで別人になりすませる。**
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS:-127.0.0.1/32,::1/128,172.16.0.0/12}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-metal_prices}
      - POSTGRES_USER=${POSTGRES_USER:-metal_user}
      - POSTGRES_PASSWORD_FILE=/shared/postgres_password
      - USER_STATE_POSTGRES_DB=${USER_STATE_POSTGRES_DB:-user_state_audit}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-5}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-10}
      - DB_POOL_TIMEOUT=${DB_POOL_TIMEOUT:-30}
      - DB_POOL_RECYCLE=${DB_POOL_RECYCLE:-1800}
      - ADMIN_PORT=5001
    volumes:
      - app_data:/app/data
      - shared_secrets:/shared:ro
      # status.json を読んで sycs_backup_age_seconds を出すためだけ。読み取り
      # 専用で付ける（バックアップを消せる必要は無い）。
      - postgres_backups:/backups:ro
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 512
    mem_limit: 768m

  sycs-voldemort-web:
    build:
      context: .
    container_name: sycs-voldemort-web
    restart: unless-stopped
    command: python web_main.py
    depends_on:
      postgres:
        condition: service_healthy
      # **service_healthy にしないこと。** 共有キャッシュは無くても正しく動く層
      # として作ってある（services/shared_cache.py の冒頭）。healthy を待つ形に
      # すると、Valkey が上がらないだけで web が起動できなくなり、「キャッシュの
      # 故障が、キャッシュが無ければ起きなかった障害を作る」ことになる。
      # 起動順だけ揃えて、繋がらない場合は遮断器に任せる。
      valkey:
        condition: service_started
    ports:
      - "${WEB_HOST_PORT:-8001}:8000"
    environment:
      - TZ=Asia/Tokyo
      - METALPRICE_API_KEY=${METALPRICE_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - WEB_WORKERS=${WEB_WORKERS:-2}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-metal_prices}
      - POSTGRES_USER=${POSTGRES_USER:-metal_user}
      - POSTGRES_PASSWORD_FILE=/shared/postgres_password
      - DB_POOL_SIZE=${DB_POOL_SIZE:-5}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-10}
      - DB_POOL_TIMEOUT=${DB_POOL_TIMEOUT:-30}
      - DB_POOL_RECYCLE=${DB_POOL_RECYCLE:-1800}
      # WEB_WORKERS が2以上のとき、これが無いとワーカーごとに別のキャッシュを
      # 持つ（同じ問い合わせに DB クエリと予測計算が2回走る）。
      - VALKEY_URL=${VALKEY_URL:-redis://valkey:6379/0}
      # ワーカーごとに web-<PID> という名前で報告する。どのワーカーが落ちたかを
      # 区別できるようにするため（advisory lock とは無関係に全ワーカーが報告する）。
      - METRICS_REPORT_INTERVAL_SECONDS=${METRICS_REPORT_INTERVAL_SECONDS:-30}
      - API_RATE_LIMIT_PER_MINUTE=${API_RATE_LIMIT_PER_MINUTE:-120}
      - API_CALCULATE_RATE_LIMIT_PER_MINUTE=${API_CALCULATE_RATE_LIMIT_PER_MINUTE:-60}
      - API_RESPONSE_CACHE_SECONDS=${API_RESPONSE_CACHE_SECONDS:-20}
      - PURITY_OPTIONS_CACHE_SECONDS=${PURITY_OPTIONS_CACHE_SECONDS:-3600}
      - PUSH_PUBLIC_KEY_CACHE_SECONDS=${PUSH_PUBLIC_KEY_CACHE_SECONDS:-3600}
      - FORECAST_REFRESH_MINUTE_JST=${FORECAST_REFRESH_MINUTE_JST:-5}
      - FORECAST_INTERVAL_PROB=${FORECAST_INTERVAL_PROB:-0.8}
      - FORECAST_TILT_MAX_PCT_PER_DAY=${FORECAST_TILT_MAX_PCT_PER_DAY:-0.15}
      - FORECAST_WIDTH_REFERENCE_PCT=${FORECAST_WIDTH_REFERENCE_PCT:-12.0}
      - FORECAST_INTERVAL_WIDTH_MULTIPLIER=${FORECAST_INTERVAL_WIDTH_MULTIPLIER:-1.35}
      - FORECAST_INTERVAL_WIDTH_MULTIPLIER_MIN=${FORECAST_INTERVAL_WIDTH_MULTIPLIER_MIN:-1.10}
      - FORECAST_LLM_MAX_COMPLETION_TOKENS=${FORECAST_LLM_MAX_COMPLETION_TOKENS:-3000}
      - FORECAST_SUMMARY_MAX_COMPLETION_TOKENS=${FORECAST_SUMMARY_MAX_COMPLETION_TOKENS:-3000}
      - FORECAST_LLM_REASONING_EFFORT=${FORECAST_LLM_REASONING_EFFORT:-low}
      - FORECAST_FX_BETA_MIN_SAMPLES=${FORECAST_FX_BETA_MIN_SAMPLES:-40}
      - FORECAST_ACCURACY_GOOD_MAE_PCT=${FORECAST_ACCURACY_GOOD_MAE_PCT:-1.5}
      - FORECAST_ACCURACY_BAD_MAE_PCT=${FORECAST_ACCURACY_BAD_MAE_PCT:-6.0}
      - FORECAST_CONFIDENCE_CAP_WITHOUT_ACCURACY=${FORECAST_CONFIDENCE_CAP_WITHOUT_ACCURACY:-0.75}
      - METAL_AUTO_REPAIR_ENABLED=${METAL_AUTO_REPAIR_ENABLED:-true}
      - METAL_AUTO_REPAIR_INTERVAL_MINUTES=${METAL_AUTO_REPAIR_INTERVAL_MINUTES:-30}
      - METAL_AUTO_REPAIR_FORCE_FORECAST_REFRESH=${METAL_AUTO_REPAIR_FORCE_FORECAST_REFRESH:-false}
      - PUSH_NOTIFY_HOUR_JST=${PUSH_NOTIFY_HOUR_JST:-11}
      - PUSH_NOTIFY_MINUTE_JST=${PUSH_NOTIFY_MINUTE_JST:-0}
      # マルチインスタンス時: スケジューラ担当のみ true
      - WEB_SCHEDULER_ENABLED=${WEB_SCHEDULER_ENABLED:-true}
      - APP_ROOT_PATH=${APP_ROOT_PATH:-}
      - APP_PUBLIC_PATH=${APP_PUBLIC_PATH:-/}
      - VAPID_AUTO_GENERATE=${VAPID_AUTO_GENERATE:-true}
      - VAPID_KEYS_DIR=/shared/vapid
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:admin@example.com}
      - PUSH_MAX_SUBSCRIPTIONS=${PUSH_MAX_SUBSCRIPTIONS:-50000}
      - PUSH_ALLOWED_ENDPOINT_SUFFIXES=${PUSH_ALLOWED_ENDPOINT_SUFFIXES:-}
      - TRUST_CF_HEADERS=${TRUST_CF_HEADERS:-false}
      - REQUIRE_CF_CONNECTING_IP=${REQUIRE_CF_CONNECTING_IP:-false}
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS:-127.0.0.1/32,::1/128,172.16.0.0/12}
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-3650}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-metals.kawasaki-n3t.f5.si,localhost,127.0.0.1,::1}
      # 起動時テスト機能（HTTP公開なし・環境変数指定時のみ）
      - STARTUP_TEST_MODE=${STARTUP_TEST_MODE:-false}
      - STARTUP_TEST_REQUIRE_DOCKER=${STARTUP_TEST_REQUIRE_DOCKER:-true}
      - STARTUP_TEST_RUN_MIDNIGHT_JOB_ON_BOOT=${STARTUP_TEST_RUN_MIDNIGHT_JOB_ON_BOOT:-false}
      - STARTUP_TEST_FORCE_SNAPSHOT_REFRESH=${STARTUP_TEST_FORCE_SNAPSHOT_REFRESH:-true}
      - STARTUP_TEST_RUN_PUSH_ON_BOOT=${STARTUP_TEST_RUN_PUSH_ON_BOOT:-false}
    volumes:
      - app_data:/app/data
      - shared_secrets:/shared
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 512
    mem_limit: 1g

volumes:
  postgres_data:
  shared_secrets:
  app_data:
  # バックアップは postgres_data と別のボリュームに置く。同じボリュームに
  # 入れると、消える理由（ボリューム破損・誤った docker volume rm）が
  # そのままバックアップにも当たるので、あってもなくても同じになる。
  postgres_backups:
