services:
  postgres-secret-init:
    image: alpine:3.21
    container_name: sycs-voldemort-postgres-secret-init
    restart: "no"
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        mkdir -p /shared
        if [ ! -s /shared/postgres_password ]; then
          tr -dc 'A-Za-z0-9' </dev/urandom | head -c 48 > /shared/postgres_password
          chmod 600 /shared/postgres_password
          echo "Generated PostgreSQL password at first startup."
        else
          echo "PostgreSQL password already exists. Reusing it."
        fi
    volumes:
      - shared_secrets:/shared

  postgres:
    image: postgres:16-alpine
    container_name: sycs-voldemort-postgres
    restart: unless-stopped
    depends_on:
      postgres-secret-init:
        condition: service_completed_successfully
    environment:
      - TZ=Asia/Tokyo
      - POSTGRES_USER=${POSTGRES_USER:-metal_user}
      - POSTGRES_DB=${POSTGRES_DB:-metal_prices}
      - POSTGRES_PASSWORD_FILE=/shared/postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - shared_secrets:/shared:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-metal_user} -d ${POSTGRES_DB:-metal_prices}"]
      interval: 10s
      timeout: 5s
      retries: 5

  sycs-voldemort:
    build:
      context: .
    container_name: sycs-voldemort
    restart: unless-stopped
    depends_on:
      postgres-secret-init:
        condition: service_completed_successfully
    environment:
      - TZ=Asia/Tokyo
      # Discord Bot は環境変数でトークンを渡す
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - METALPRICE_API_KEY=${METALPRICE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY}
      # Bot 設定ファイルの保存先（ボリュームマウント先に合わせる）
      - SETTINGS_DIR=/app/data
      - SETTINGS_LOCK_TIMEOUT_SECONDS=${SETTINGS_LOCK_TIMEOUT_SECONDS:-10}
      - SETTINGS_LOCK_STALE_SECONDS=${SETTINGS_LOCK_STALE_SECONDS:-30}
      # マルチインスタンス時: 背景ジョブ担当のみ true
      - BOT_BACKGROUND_WORKER=${BOT_BACKGROUND_WORKER:-true}
      # DJAudio-DL: Discord に貼る MP3 ダウンロード URL のベース（外部からアクセス可能な admin の URL）
      - DJAUDIO_BASE_URL=${DJAUDIO_BASE_URL:-http://localhost:5001}
    volumes:
      - ./data:/app/data

  sycs-voldemort-admin:
    build:
      context: .
    container_name: sycs-voldemort-admin
    restart: unless-stopped
    command: python admin_main.py
    depends_on:
      postgres-secret-init:
        condition: service_completed_successfully
    ports:
      - "${ADMIN_HOST_PORT:-5001}:5001"
    environment:
      - TZ=Asia/Tokyo
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
      - DISCORD_REDIRECT_URI=${DISCORD_REDIRECT_URI:-http://localhost:5001/admin/callback}
      - ADMIN_FLASK_SECRET_KEY=${ADMIN_FLASK_SECRET_KEY}
      - FLASK_SECURE_COOKIES=${FLASK_SECURE_COOKIES:-false}
      - ADMIN_ASSET_VERSION=${ADMIN_ASSET_VERSION:-20260507-monitoring}
      - ADMIN_LIMITER_STORAGE_URI=${ADMIN_LIMITER_STORAGE_URI:-memory://}
      - ADMIN_TPS_TARGET=${ADMIN_TPS_TARGET:-50}
      - ADMIN_MONITOR_INTERVAL_SECONDS=${ADMIN_MONITOR_INTERVAL_SECONDS:-30}
      - ADMIN_DOWNTIME_GRACE_SECONDS=${ADMIN_DOWNTIME_GRACE_SECONDS:-120}
      - ADMIN_CPU_ALERT_PERCENT=${ADMIN_CPU_ALERT_PERCENT:-90}
      - ADMIN_MEMORY_ALERT_PERCENT=${ADMIN_MEMORY_ALERT_PERCENT:-90}
      - ADMIN_TPS_ALERT_PERCENT=${ADMIN_TPS_ALERT_PERCENT:-100}
      - SETTINGS_DIR=/app/data
      - SETTINGS_LOCK_TIMEOUT_SECONDS=${SETTINGS_LOCK_TIMEOUT_SECONDS:-10}
      - SETTINGS_LOCK_STALE_SECONDS=${SETTINGS_LOCK_STALE_SECONDS:-30}
      - ADMIN_PORT=5001
    volumes:
      - ./data:/app/data

  sycs-voldemort-web:
    build:
      context: .
    container_name: sycs-voldemort-web
    restart: unless-stopped
    command: python web_main.py
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${WEB_HOST_PORT:-8001}:8000"
    environment:
      - TZ=Asia/Tokyo
      - METALPRICE_API_KEY=${METALPRICE_API_KEY}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-metal_prices}
      - POSTGRES_USER=${POSTGRES_USER:-metal_user}
      - POSTGRES_PASSWORD_FILE=/shared/postgres_password
      - API_RATE_LIMIT_PER_MINUTE=${API_RATE_LIMIT_PER_MINUTE:-120}
      - API_CALCULATE_RATE_LIMIT_PER_MINUTE=${API_CALCULATE_RATE_LIMIT_PER_MINUTE:-60}
      - API_RESPONSE_CACHE_SECONDS=${API_RESPONSE_CACHE_SECONDS:-20}
      - PURITY_OPTIONS_CACHE_SECONDS=${PURITY_OPTIONS_CACHE_SECONDS:-3600}
      - PUSH_PUBLIC_KEY_CACHE_SECONDS=${PUSH_PUBLIC_KEY_CACHE_SECONDS:-3600}
      - FORECAST_REFRESH_MINUTE_JST=${FORECAST_REFRESH_MINUTE_JST:-5}
      - FORECAST_SARIMAX_ENABLED=${FORECAST_SARIMAX_ENABLED:-true}
      - FORECAST_SARIMAX_MIN_HISTORY=${FORECAST_SARIMAX_MIN_HISTORY:-24}
      - PUSH_NOTIFY_HOUR_JST=${PUSH_NOTIFY_HOUR_JST:-11}
      - PUSH_NOTIFY_MINUTE_JST=${PUSH_NOTIFY_MINUTE_JST:-0}
      # マルチインスタンス時: スケジューラ担当のみ true
      - WEB_SCHEDULER_ENABLED=${WEB_SCHEDULER_ENABLED:-true}
      - APP_ROOT_PATH=${APP_ROOT_PATH:-}
      - APP_PUBLIC_PATH=${APP_PUBLIC_PATH:-/}
      - VAPID_AUTO_GENERATE=${VAPID_AUTO_GENERATE:-true}
      - VAPID_KEYS_DIR=/shared/vapid
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:admin@example.com}
      - TRUST_CF_HEADERS=${TRUST_CF_HEADERS:-true}
      - REQUIRE_CF_CONNECTING_IP=${REQUIRE_CF_CONNECTING_IP:-false}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      # 起動時テスト機能（HTTP公開なし・環境変数指定時のみ）
      - STARTUP_TEST_MODE=${STARTUP_TEST_MODE:-false}
      - STARTUP_TEST_REQUIRE_DOCKER=${STARTUP_TEST_REQUIRE_DOCKER:-true}
      - STARTUP_TEST_RUN_MIDNIGHT_JOB_ON_BOOT=${STARTUP_TEST_RUN_MIDNIGHT_JOB_ON_BOOT:-false}
      - STARTUP_TEST_FORCE_SNAPSHOT_REFRESH=${STARTUP_TEST_FORCE_SNAPSHOT_REFRESH:-true}
      - STARTUP_TEST_RUN_PUSH_ON_BOOT=${STARTUP_TEST_RUN_PUSH_ON_BOOT:-false}
    volumes:
      - ./data:/app/data
      - shared_secrets:/shared

volumes:
  postgres_data:
  shared_secrets:
