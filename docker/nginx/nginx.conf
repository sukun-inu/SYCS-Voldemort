# 管理画面・Web・配信の前に立つ nginx の全体の設定（中身の server は sycs.conf.template）。
#
# 書き込めるのは /tmp だけ（compose で read_only にしてある）。pid と一時ファイルの置き場をすべて /tmp に寄せる。
# テンプレートから作った設定（/tmp/nginx/sycs.conf）は、公式イメージの入口（20-envsubst-on-templates.sh）が
# 起動のたびに作る。

user  nginx;
worker_processes  auto;

# 公式イメージでは /var/log/nginx/*.log が標準出力・標準エラーへのリンクになっている。直接そちらへ書く。
error_log  /dev/stderr  notice;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path  /tmp/nginx-client-body;
    proxy_temp_path        /tmp/nginx-proxy;
    fastcgi_temp_path      /tmp/nginx-fastcgi;
    uwsgi_temp_path        /tmp/nginx-uwsgi;
    scgi_temp_path         /tmp/nginx-scgi;

    # アクセスログは標準出力（docker logs で見る）。nginx の前の相手（Cloudflare のトンネル）が付けた
    # X-Forwarded-For と CF-Connecting-IP も残す（$remote_addr はトンネルかブリッジのゲートウェイになる）。
    log_format  sycs  '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" xff="$http_x_forwarded_for" cf="$http_cf_connecting_ip" '
                      'upstream="$upstream_addr" rt=$request_time';
    access_log  /dev/stdout  sycs;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    include /tmp/nginx/*.conf;
}
