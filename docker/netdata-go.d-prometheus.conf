# Netdata が SYCS-Voldemort の /metrics を読むための設定。
#
# ■ 置き場所（ホスト側。このリポジトリの中ではない）
#
#   /etc/netdata/go.d/prometheus.conf
#
# 既にそのファイルがある場合は、下の jobs: の中身だけを既存の jobs: へ足すこと。
# ファイルを丸ごと置き換えると、他の収集対象の設定が消える。
#
#   sudo cp docker/netdata-go.d-prometheus.conf /etc/netdata/go.d/prometheus.conf
#   sudo systemctl restart netdata
#
# ■ 動いているかの確認
#
#   sudo -u netdata /usr/libexec/netdata/plugins.d/go.d.plugin -d -m prometheus
#
# 出力に sycs_up が出れば読めている。403 が返る場合は接続元が
# METRICS_ALLOWED_CIDRS に入っていない（compose の admin の環境変数）。
#
# ■ なぜ 127.0.0.1 なのか
#
# Netdata はホスト上で動き、管理画面はホストの 5001 番へ公開されている。
# コンテナの中から見た接続元は Docker のブリッジのゲートウェイになるので、
# アプリ側の許可範囲は 172.16.0.0/12 を含んでいる（既定でそうなっている）。
#
# ■ 何が読めるか
#
#   sycs_up{app="bot"}                      1/0。**0 なら Bot が止まっている**
#   sycs_up{app="admin"}                    管理画面
#   sycs_up{app="web-<PID>"}                web はワーカーごとに1系列
#   sycs_heartbeat_age_seconds{app=...}     最後の報告からの経過秒数
#   sycs_shared_cache_available             Valkey へ書き読みできているか
#   sycs_backup_status                      1/0。**0 ならバックアップが取れていない**
#                                           （失敗・1度も動いていない・状態ファイルが
#                                           読めない）。アラートはこちらに張る
#   sycs_backup_age_seconds                 最後に**成功した**バックアップからの秒数
#   sycs_exceptions_total{app=,type=}       例外の型ごとの累積
#   sycs_http_responses_total{app=,code=}   応答コードごとの累積
#   sycs_requests_total{app=}               リクエストの累積
#   sycs_admin_request_tps                  管理画面の秒間リクエスト数
#   sycs_bot_guilds / bot_members_visible / bot_voice_clients
#   sycs_bot_gateway_latency_seconds        Discord ゲートウェイまでの往復（秒）
#   sycs_web_cache_items_*                  ワーカーごとの一次キャッシュ件数
#
# ホストの CPU・メモリ・ディスク・ネットワークはここには出していない。
# Netdata が自分で測るものを重ねて出す意味が無く、しかもアプリ側で測るには
# psutil が 0.1 秒ブロックするため。

jobs:
  - name: sycs_voldemort
    url: http://127.0.0.1:5001/metrics
    # 既定の 10 秒より長くしている。中身は30秒ごとに更新されるので、それより
    # 細かく読んでも同じ値を何度も見るだけになる。
    update_every: 10
    # 応答しないときに長く待たない。管理画面が固まっているときに、Netdata 側の
    # 収集が詰まるのを避ける。
    timeout: 3
    # メトリクス名が sycs_ で始まるものだけ拾う。管理画面が将来別のものを
    # 出しても、こちらの意図しない系列が増えないようにする。
    selector:
      allow:
        - sycs_*
